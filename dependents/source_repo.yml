# -------------------------------------------------------------------------------------------------
# This workflow is meant to be copied to the source repo, in order to to build the website
# trigger the deployment.
# Remember to edit the placeholder commands and env variables below to best suit your needs.
# You should also create a PREVIEW_TOKEN secret following the action's README.
# -------------------------------------------------------------------------------------------------

name: Deploy
on:
  push:
    branches:
      - 'main'
  delete:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
  workflow_dispatch:
    inputs:
      action:
        description: Deploy or remove a preview
        required: true
        type: choice
        options:
          - deploy
          - remove
      pr_number:
        description: PR number (for PR previews)
        required: false
        type: string
      ref:
        description: Branch name or git ref (for branch previews)
        required: false
        type: string
      ref_type:
        description: branch or tag (tags are ignored)
        required: false
        type: choice
        options:
          - branch
          - tag

concurrency:
  group: preview-${{ github.event_name }}-${{ github.event.number || github.ref_name || inputs.pr_number || inputs.ref }}
  cancel-in-progress: true

jobs:
  dev:
    name: Development
    runs-on: ubuntu-latest
    env:
      PREVIEW_REPO: octocat/preview
      PAGES_BASE: https://octocat.github.io/preview
      IS_REMOVE: ${{ github.event.action == 'closed' || (github.event_name == 'workflow_dispatch' && inputs.action == 'remove') }}
      IS_PR_PREVIEW: ${{ startsWith(github.event_name, 'pull_request') || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '') }}

    steps:
      - name: Checkout branch
        if: ${{ !IS_PR_PREVIEW && github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@v4

      - name: Checkout branch (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.pr_number == '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Checkout PR head
        if: ${{ IS_PR_PREVIEW && !IS_REMOVE && github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Checkout PR head (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && inputs.action != 'remove' }}
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/merge

      # Assuming you're using Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        if: ${{ !IS_REMOVE }}
        with:
          node-version: '16'
          cache: npm

      - name: Install dependencies
        if: ${{ !IS_REMOVE }}
        run: npm ci --ignore-scripts

      # This will calculate the base URL for the website, based on the event that triggered the workflow.
      # Leave this step as it is, unless you know what you're doing.
      - name: Determine base URL
        if: ${{ !IS_REMOVE }}
        id: baseurl
        run: |
          if [ "${{ github.event_name }}" == "pull_request_target" ] || { [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.pr_number }}" ]; }; then
            if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              pr="${{ inputs.pr_number }}"
            else
              pr="${{ github.event.number }}"
            fi
            full="${{ env.PAGES_BASE }}/${{ github.repository }}/pr/${pr}"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.ref }}" ]; then
            full="${{ env.PAGES_BASE }}/${{ github.repository }}/branch/${{ inputs.ref }}"
          else
            full="${{ env.PAGES_BASE }}/${{ github.repository }}/branch/${{ github.ref_name }}"
          fi

          relative=/$(echo "$full" | cut -d/ -f4-)

          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "relative=$relative" >> "$GITHUB_OUTPUT"
        shell: bash

      # Run your usual build command, but make sure to use the correct base URL
      # This example assumes you're using React, and that you're using the PUBLIC_URL env variable
      - name: Build
        if: ${{ !IS_REMOVE }}
        run: npm run build
        env:
          PUBLIC_URL: ${{ steps.baseurl.outputs.relative }}

      # This will trigger the action. Make sure to change the build_dir input to the correct directory
      - uses: EndBug/pages-preview@v1
        with:
          build_dir: build # Change this!
          preview_base_url: ${{ env.PAGES_BASE }}
          preview_repo: ${{ env.PREVIEW_REPO }}
          preview_token: ${{ secrets.PREVIEW_TOKEN }}
          action: ${{ github.event_name == 'workflow_dispatch' && inputs.action || '' }}
          pr_number: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || '' }}
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
          ref_type: ${{ github.event_name == 'workflow_dispatch' && inputs.ref_type || '' }}
